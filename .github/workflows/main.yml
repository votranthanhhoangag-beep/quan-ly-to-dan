name: Keep Supabase Alive

on:
  schedule:
    # Chạy lúc 8:00 sáng giờ Việt Nam (01:00 UTC) mỗi ngày
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_data_stores?select=id&limit=1"
